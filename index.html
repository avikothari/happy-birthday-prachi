<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For Prachi</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;1,500;1,700&family=Pinyon+Script&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<button class="theme" id="themeBtn" type="button" aria-label="Switch between light and dark theme"></button>
<svg class="defs" aria-hidden="true"><defs>
<symbol id="sp" viewBox="0 0 100 100"><g fill="currentColor" stroke="none"><path d="M6 96C36 76 62 44 94 6" stroke="currentColor" stroke-width="1.6" fill="none"/><path id="lf" d="M0 0C7-9 17-9 24 0C17 9 7 9 0 0Z" transform="translate(22 70) rotate(-30)"/><use href="#lf" transform="translate(12 22) rotate(30)"/><use href="#lf" transform="translate(30 -4) rotate(-70)"/><use href="#lf" transform="translate(28 -26) rotate(-20)"/><use href="#lf" transform="translate(44 -34) rotate(-80)"/><use href="#lf" transform="translate(60 -50) rotate(-30)"/></g></symbol>
<symbol id="dv" viewBox="0 0 46 20"><g fill="currentColor"><path d="M23 10C16 2 8 2 2 10C8 18 16 18 23 10Z" transform="scale(.9 .8) translate(1 2)"/><path d="M23 10C30 2 38 2 44 10C38 18 30 18 23 10Z" transform="scale(.9 .8) translate(4 2)"/></g></symbol>
<symbol id="rbw" viewBox="0 0 200 105"><g fill="none" stroke-width="11" stroke-linecap="round"><path d="M12 100A88 88 0 0 1 188 100" stroke="#f4b9c4"/><path d="M26 100A74 74 0 0 1 174 100" stroke="#fbd3b5"/><path d="M40 100A60 60 0 0 1 160 100" stroke="#fde9c0"/><path d="M54 100A46 46 0 0 1 146 100" stroke="#d7e6d3"/><path d="M68 100A32 32 0 0 1 132 100" stroke="#cdb8e3"/></g></symbol>
</defs></svg>

<section class="s hero">
  <svg class="sprig l" viewBox="0 0 100 100"><use href="#sp"/></svg>
  <svg class="sprig r" viewBox="0 0 100 100"><use href="#sp"/></svg>
  <div class="in">
    <svg class="rb" viewBox="0 0 200 105"><use href="#rbw"/></svg>
    <div class="k">for the one and only</div>
    <h1>Prachi</h1>
    <p>Puchi to me. Everyone’s favourite person.</p>
    <div class="hint">scroll gently</div>
  </div>
</section>

<main id="chapters"></main>

<section class="s b2 finale" id="finale">
  <div class="in">
    <svg class="rb" viewBox="0 0 200 105"><use href="#rbw"/></svg>
    <h2>All of her, in one frame</h2>
    <p class="sub">Every photo you just saw, becoming one.</p>
    <div class="div"><i></i><svg viewBox="0 0 46 20"><use href="#dv"/></svg><i></i></div>
    <div class="mosaic" id="mosaic"><canvas id="mc"></canvas><img class="fav" id="fav" alt="Prachi"></div>
    <p class="mnote">tap the picture to see her up close</p>
    <div class="big" id="hb">Happy Birthday, Prachi</div>
    <div class="date" id="dt">21 November</div>
    <button id="open">Open my letter</button>
    <div class="letter" id="letter"><div id="lt"></div></div>
  </div>
</section>

<script src="mosaic-data.js"></script>
<script src="letter.js"></script>
<script src="script.js"></script>
</body>
</html>
